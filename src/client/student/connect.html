<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Connect to Server</title>
<style>
  body { background: #091e42; color: white; font-family: sans-serif; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }
  .box { background: white; color: #333; padding: 40px; border-radius: 8px; width: 340px; text-align: center; }
  input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
  button { width: 100%; padding: 12px; background: #0052cc; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h2>Connect to CBT Server</h2>
    <input type="text" id="ip" placeholder="e.g. 192.168.1.100"/>
    <button onclick="connect()">Connect Workstation</button>
  </div>
  <script>
    function connect() {
      const ip = document.getElementById('ip').value.trim();
      if (!ip) return alert("Enter server IP.");
      window.location.href = `http://${ip}:3000/exam`;
    }
  </script>
</body>
</html>
